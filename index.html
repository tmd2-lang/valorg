<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VALORG</title>
  <meta name="description" content="A place to organize projects, companies, and everything else." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name">VALORG</span>
      </div>
      <div class="topbar-actions">
        <span class="count" id="count"></span>
        <button class="btn btn-primary" id="addBtnTop">
          <span class="plus">+</span> Add project
        </button>
      </div>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="page">

    <!-- ---- LIST VIEW: all projects ---- -->
    <div id="listView">

      <!-- Shown when there are zero projects -->
      <section class="empty" id="empty" hidden>
        <button class="empty-target" id="addBtnEmpty">
          <span class="empty-plus">+</span>
          <span class="empty-title">Add your first project</span>
          <span class="empty-sub">Companies, side projects, anything you're building</span>
        </button>
      </section>

      <!-- The grid of project cards -->
      <section class="grid" id="grid"></section>

    </div>

    <!-- ---- DETAIL VIEW: one project and its tasks ---- -->
    <div id="detailView" hidden>

      <a class="back" href="#/">&larr; All projects</a>

      <header class="detail-head">
        <div class="detail-titles">
          <h1 class="detail-name" id="dName"></h1>
          <p class="detail-note" id="dNote"></p>
        </div>
        <div class="detail-tools">
          <span class="pill" id="dStatus"></span>
          <button class="icon-btn" id="dEdit" type="button" title="Edit project" aria-label="Edit project">&#9998;</button>
          <button class="icon-btn danger" id="dDelete" type="button" title="Delete project" aria-label="Delete project">&#10005;</button>
        </div>
      </header>

      <section class="tasks">
        <div class="tasks-head">
          <h2 class="tasks-title">Tasks</h2>
          <span class="task-count" id="taskCount"></span>
        </div>

        <form class="task-add" id="taskForm">
          <input class="input" id="taskInput" type="text" placeholder="Add a task and press Enter"
                 maxlength="200" autocomplete="off" />
          <button class="btn btn-ghost" type="submit">Add</button>
        </form>

        <ul class="task-list" id="taskList"></ul>
        <p class="tasks-empty" id="tasksEmpty" hidden>No tasks yet.</p>
      </section>

    </div>

  </main>

  <!-- ============ ADD / EDIT DIALOG ============ -->
  <dialog class="dialog" id="dialog">
    <form method="dialog" id="form">
      <h2 class="dialog-title" id="dialogTitle">New project</h2>

      <label class="field">
        <span class="field-label">Name</span>
        <input class="input" id="fName" name="name" type="text"
               placeholder="Valorg, Inc." maxlength="80" required autocomplete="off" />
      </label>

      <label class="field">
        <span class="field-label">What is it? <span class="opt">optional</span></span>
        <textarea class="input textarea" id="fNote" name="note" rows="3"
                  placeholder="One line so future-you remembers." maxlength="280"></textarea>
      </label>

      <label class="field">
        <span class="field-label">Status</span>
        <select class="input" id="fStatus" name="status">
          <option value="idea">Idea</option>
          <option value="active" selected>Active</option>
          <option value="paused">Paused</option>
          <option value="done">Done</option>
        </select>
      </label>

      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" type="submit" id="saveBtn">Create</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
