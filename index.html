<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VALORG</title>
  <meta name="description" content="A place to organize projects, companies, and everything else." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-group">
        <a class="brand" href="#/">
          <span class="brand-mark">◈</span>
          <span class="brand-name">VALORG</span>
        </a>
        <nav class="nav" id="nav">
          <a class="nav-link" href="#/"         data-route="home">Home</a>
          <a class="nav-link" href="#/projects" data-route="projects">Projects</a>
        </nav>
      </div>
      <div class="topbar-actions">
        <span class="count" id="count"></span>
        <button class="btn btn-primary" id="addBtnTop">
          <span class="plus">+</span> Add project
        </button>
        <div class="account" id="account" hidden>
          <span class="account-email" id="accountEmail"></span>
          <button class="btn btn-ghost btn-sm" id="signOutBtn">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Slim strip under the header for saving / connection messages -->
  <div class="banner" id="banner" hidden></div>

  <!-- ============ LOADING ============ -->
  <div class="booting" id="booting">Loading…</div>

  <!-- ============ SIGN IN ============ -->
  <main class="page" id="authView" hidden>
    <section class="auth">
      <h1 class="auth-title">VALORG</h1>
      <p class="auth-sub" id="authSub">Sign in to get to your projects.</p>

      <form class="auth-form" id="authForm">
        <input class="input" id="authEmail" type="email" required
               placeholder="you@example.com" autocomplete="email" />
        <input class="input" id="authPassword" type="password" required minlength="8"
               placeholder="Password" autocomplete="current-password" />
        <button class="btn btn-primary" type="submit" id="authBtn">Sign in</button>
      </form>

      <p class="auth-note" id="authNote" hidden></p>

      <button class="auth-switch" id="authSwitch" type="button">
        Need an account? Sign up
      </button>
    </section>
  </main>

  <!-- ============ THE APP ============ -->
  <main class="page" id="appView" hidden>

    <!-- Offer to bring over data saved in this browser before we had accounts -->
    <div class="import" id="importBar" hidden>
      <span id="importText"></span>
      <span class="import-actions">
        <button class="btn btn-primary btn-sm" id="importYes">Import</button>
        <button class="btn btn-ghost btn-sm" id="importNo">No thanks</button>
      </span>
    </div>

    <!-- ---- HOME: what needs doing, and what it's all for ---- -->
    <div id="homeView" hidden>

      <section class="block">
        <div class="block-head">
          <h2 class="block-title">Now</h2>
          <span class="block-meta" id="nowMeta"></span>
        </div>
        <ul class="task-list" id="nowList"></ul>
        <p class="block-empty" id="nowEmpty" hidden>
          Nothing open. Open a project and add a task.
        </p>
      </section>

      <section class="block">
        <div class="block-head">
          <h2 class="block-title">Goals</h2>
        </div>
        <ul class="goal-list" id="goalList"></ul>
      </section>

    </div>

    <!-- ---- LIST VIEW: all projects ---- -->
    <div id="listView">

      <section class="empty" id="empty" hidden>
        <button class="empty-target" id="addBtnEmpty">
          <span class="empty-plus">+</span>
          <span class="empty-title">Add your first project</span>
          <span class="empty-sub">Companies, side projects, anything you're building</span>
        </button>
      </section>

      <section class="grid" id="grid"></section>

    </div>

    <!-- ---- DETAIL VIEW: one project and its tasks ---- -->
    <div id="detailView" hidden>

      <a class="back" href="#/projects">&larr; All projects</a>

      <header class="detail-head">
        <div class="detail-titles">
          <h1 class="detail-name" id="dName"></h1>
          <p class="detail-note" id="dNote"></p>
        </div>
        <div class="detail-tools">
          <span class="pill" id="dStatus"></span>
          <button class="icon-btn" id="dEdit" type="button" title="Edit project" aria-label="Edit project">&#9998;</button>
          <button class="icon-btn danger" id="dDelete" type="button" title="Delete project" aria-label="Delete project">&#10005;</button>
        </div>
      </header>

      <blockquote class="goal" id="dGoal" hidden>
        <span class="goal-label">Goal</span>
        <span class="goal-text" id="dGoalText"></span>
      </blockquote>

      <section class="tasks">
        <div class="tasks-head">
          <h2 class="tasks-title">Tasks</h2>
          <span class="task-count" id="taskCount"></span>
        </div>

        <form class="task-add" id="taskForm">
          <input class="input" id="taskInput" type="text" placeholder="Add a task and press Enter"
                 maxlength="200" autocomplete="off" />
          <button class="btn btn-ghost" type="submit">Add</button>
        </form>

        <ul class="task-list" id="taskList"></ul>
        <p class="tasks-empty" id="tasksEmpty" hidden>No tasks yet.</p>
      </section>

    </div>

  </main>

  <!-- ============ ADD / EDIT DIALOG ============ -->
  <dialog class="dialog" id="dialog">
    <form method="dialog" id="form">
      <h2 class="dialog-title" id="dialogTitle">New project</h2>

      <label class="field">
        <span class="field-label">Name</span>
        <input class="input" id="fName" name="name" type="text"
               placeholder="Valorg, Inc." maxlength="80" required autocomplete="off" />
      </label>

      <label class="field">
        <span class="field-label">Goal <span class="opt">optional</span></span>
        <input class="input" id="fGoal" name="goal" type="text" maxlength="140"
               placeholder="Make this a $10M ARR company." autocomplete="off" />
        <span class="field-hint">One line. Where is this going? You'll see it every time you open the project.</span>
      </label>

      <label class="field">
        <span class="field-label">What is it? <span class="opt">optional</span></span>
        <textarea class="input textarea" id="fNote" name="note" rows="2"
                  placeholder="One line so future-you remembers." maxlength="280"></textarea>
      </label>

      <label class="field">
        <span class="field-label">Status</span>
        <select class="input" id="fStatus" name="status">
          <option value="idea">Idea</option>
          <option value="active" selected>Active</option>
          <option value="paused">Paused</option>
          <option value="done">Done</option>
        </select>
      </label>

      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" type="submit" id="saveBtn">Create</button>
      </div>
    </form>
  </dialog>

  <!-- ============ TASK DIALOG ============ -->
  <dialog class="dialog" id="taskDialog">
    <form method="dialog" id="taskEditForm">
      <h2 class="dialog-title">Task</h2>

      <label class="field">
        <span class="field-label">Task</span>
        <input class="input" id="tTitle" type="text" maxlength="200" required autocomplete="off" />
      </label>

      <label class="field">
        <span class="field-label">Due <span class="opt">optional</span></span>
        <input class="input" id="tDue" type="date" />
      </label>

      <label class="field">
        <span class="field-label">Notes <span class="opt">optional</span></span>
        <textarea class="input textarea" id="tNotes" rows="4"
                  placeholder="Anything worth remembering about this one." maxlength="2000"></textarea>
      </label>

      <div class="field">
        <span class="field-label">History</span>
        <ol class="history" id="tHistory"></ol>
      </div>

      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" id="tCancel">Cancel</button>
        <button class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
